<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" fill="none" viewBox="0 0 1200 420"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0f1d"/><stop offset="50%" stop-color="#0d1527"/><stop offset="100%" stop-color="#050811"/></linearGradient><linearGradient id="accent-cyan" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="glow-card" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#38bdf8" stop-opacity=".15"/><stop offset="100%" stop-color="#1e293b" stop-opacity=".6"/></linearGradient><pattern id="grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#334155" stroke-opacity=".25" stroke-width=".75" d="M 40 0 L 0 0 0 40"/></pattern><radialGradient id="orb-blue" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#38bdf8" stop-opacity=".3"/><stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/></radialGradient><radialGradient id="orb-purple" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#a855f7" stop-opacity=".25"/><stop offset="100%" stop-color="#a855f7" stop-opacity="0"/></radialGradient><filter id="blur-glow"><feGaussianBlur stdDeviation="30"/></filter><filter id="pill-shadow"><feDropShadow dx="0" dy="4" flood-color="#000" flood-opacity=".3" stdDeviation="6"/></filter><style>@keyframes floatSlow{0%{transform:translateY(0) scale(1)}50%{transform:translateY(-16px) scale(1.05)}}@keyframes floatReverse{0%{transform:translateY(0) scale(1)}50%{transform:translateY(14px) scale(.96)}}@keyframes pulseGlow{0%{opacity:.35}50%{opacity:.65}}@keyframes streamData{0%{stroke-dashoffset:400}}@keyframes rotateSlow{0%{transform:rotate(0deg)}}.title-text{font-size:44px;font-weight:800;letter-spacing:-.5px;fill:#fff}.pill-text,.subtitle-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif}.subtitle-text{font-size:20px;font-weight:400;letter-spacing:.2px;fill:#94a3b8}.pill-text{font-size:13px;font-weight:600;fill:#e2e8f0}.log-code{font-family:&quot;SF Mono&quot;,Monaco,Menlo,Consolas,monospace;font-size:12px;fill:#38bdf8}.badge-label{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;fill:#38bdf8}.floating-orb-1{animation:floatSlow 8s ease-in-out infinite}.floating-orb-2{animation:floatReverse 10s ease-in-out infinite}.pulsing-glow{animation:pulseGlow 4s ease-in-out infinite}.streaming-path{stroke-dasharray:12,12;animation:streamData 12s linear infinite}.stream-fast{stroke-dasharray:8,8;animation:streamData 6s linear infinite}.rotating-compass{transform-origin:1060px 100px;animation:rotateSlow 24s linear infinite}</style></defs><rect width="1200" height="420" fill="url(#bg-grad)" rx="16"/><g filter="url(#blur-glow)"><circle cx="220" cy="110" r="140" fill="url(#orb-blue)" class="floating-orb-1 pulsing-glow"/><circle cx="980" cy="280" r="160" fill="url(#orb-purple)" class="floating-orb-2 pulsing-glow"/></g><rect width="1200" height="420" fill="url(#grid-pattern)" rx="16"/><g opacity=".35"><path fill="none" stroke="#38bdf8" stroke-width="2.5" d="M -50 320 C 250 240, 450 380, 750 300 C 950 250, 1100 350, 1250 310" class="streaming-path"/><path fill="none" stroke="#a855f7" stroke-width="2" d="M -50 350 C 200 390, 500 280, 800 340 C 1000 380, 1150 290, 1250 330" class="stream-fast"/><path fill="none" stroke="#818cf8" stroke-width="1.5" d="M -50 90 C 300 40, 600 130, 900 70 C 1050 40, 1150 90, 1250 80" class="streaming-path"/></g><g opacity=".4"><path fill="none" stroke="#38bdf8" stroke-width="2" d="M 30 50 L 30 30 L 50 30"/><path fill="none" stroke="#38bdf8" stroke-width="2" d="M 1170 50 L 1170 30 L 1150 30"/><path fill="none" stroke="#38bdf8" stroke-width="2" d="M 30 370 L 30 390 L 50 390"/><path fill="none" stroke="#38bdf8" stroke-width="2" d="M 1170 370 L 1170 390 L 1150 390"/></g><g class="rotating-compass" opacity=".25"><circle cx="1060" cy="100" r="60" fill="none" stroke="#38bdf8" stroke-dasharray="8 6" stroke-width="1.5"/><circle cx="1060" cy="100" r="45" fill="none" stroke="#a855f7" stroke-dasharray="4 4" stroke-width="1"/><circle cx="1060" cy="100" r="4" fill="#38bdf8"/></g><g><g transform="translate(60, 0) translate(0, 56)"><rect width="215" height="28" fill="#1e293b" stroke="#334155" stroke-width="1.2" rx="14"/><circle cx="16" cy="14" r="5" fill="#38bdf8"><animate attributeName="opacity" dur="2s" repeatCount="indefinite" values="1;0.3;1"/></circle><text x="30" y="18" class="badge-label">CURATED ECOSYSTEM</text></g><text x="0" y="132" class="title-text" transform="translate(60, 0)">API Request History &amp; <tspan fill="url(#accent-cyan)">Audit Logging</tspan></text><text x="0" y="172" class="subtitle-text" transform="translate(60, 0)">Enterprise Observability • Compliance Trails • Open-Source &amp; Cloud Telemetry</text><g transform="translate(60, 0) translate(0, 208)"><rect width="1080" height="96" fill="url(#glow-card)" stroke="#334155" stroke-width="1.2" filter="url(#pill-shadow)" rx="12"/><g transform="translate(24, 22)"><circle cx="8" cy="8" r="6" fill="#10b981"><animate attributeName="r" dur="2.4s" repeatCount="indefinite" values="5;7;5"/><animate attributeName="opacity" dur="2.4s" repeatCount="indefinite" values="1;0.6;1"/></circle><text x="24" y="13" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing=".5">EVENT STREAM INGESTION</text><text x="24" y="38" class="log-code">POST /v1/audit/events 201 Created • latency: 1.4ms • signature: ed25519_verified</text><text x="24" y="58" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Compliant with SOC2, GDPR, HIPAA, and PCI-DSS immutability requirements</text></g><g transform="translate(820, 22)"><rect width="230" height="52" fill="#0f172a" stroke="#334155" stroke-width="1" rx="8"/><text x="16" y="22" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">EST. GLOBAL MARKET</text><text x="16" y="42" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800">$4.1B → $10B+</text></g></g><g><g transform="translate(60, 0) translate(0, 332) translate(0, 0)"><rect width="180" height="36" fill="#1e293b" stroke="#38bdf8" stroke-opacity=".4" stroke-width="1" rx="18"/><text x="90" y="23" class="pill-text" text-anchor="middle">🛡️ Immutable Audit Logs</text></g><g transform="translate(60, 0) translate(0, 332) translate(192, 0)"><rect width="190" height="36" fill="#1e293b" stroke="#818cf8" stroke-opacity=".4" stroke-width="1" rx="18"/><text x="95" y="23" class="pill-text" text-anchor="middle">⚡ High-Throughput OTel</text></g><g transform="translate(60, 0) translate(0, 332) translate(394, 0)"><rect width="180" height="36" fill="#1e293b" stroke="#c084fc" stroke-opacity=".4" stroke-width="1" rx="18"/><text x="90" y="23" class="pill-text" text-anchor="middle">🔍 Distributed Tracing</text></g><g transform="translate(60, 0) translate(0, 332) translate(586, 0)"><rect width="180" height="36" fill="#1e293b" stroke="#38bdf8" stroke-opacity=".4" stroke-width="1" rx="18"/><text x="90" y="23" class="pill-text" text-anchor="middle">💾 S3 &amp; Object Retention</text></g><g transform="translate(60, 0) translate(0, 332) translate(778, 0)"><rect width="180" height="36" fill="#1e293b" stroke="#34d399" stroke-opacity=".4" stroke-width="1" rx="18"/><text x="90" y="23" class="pill-text" text-anchor="middle">📈 Real-time Dashboards</text></g></g></g></svg>